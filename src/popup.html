<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>gTabs</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup">
<header class="header"><div class="brand"><img src="icons/ui/sparkle.svg" class="brand-mark" alt=""><span>gTabs</span></div><button class="icon-btn" id="open-settings" aria-label="Open settings" title="Settings"><img src="icons/ui/gear-six.svg" alt=""></button></header>
<div class="search-wrap"><img src="icons/ui/magnifying-glass.svg" alt=""><input id="search" type="search" placeholder="Search your tabs…" aria-label="Search tabs"><kbd>⌘ K</kbd></div>
<main>
<div class="intro"><h1 id="view-title">A little less clutter.</h1><p id="view-description">Turn your open tabs into a calmer workspace. Review every group before applying.</p></div>
<div id="organize-actions" class="primary-row"><button id="organize" class="btn-primary"><img src="icons/ui/sparkle.svg" alt="">Organize tabs</button><button id="organize-ungrouped" class="btn-ghost">Ungrouped only</button></div>
<div id="status" role="status" aria-live="polite"></div>
<div id="tab-search-results"></div><div id="suggestions"></div>
<div id="empty-state" class="empty-state"><img src="icons/ui/sliders-horizontal.svg" alt=""><p>A place for everything</p><span>AI suggests groups. You make the final call.</span></div>
</main>
<footer class="popup-footer"><div class="review-actions"><button id="apply-all" class="btn-primary" hidden>Apply groups</button><button id="cancel-review" class="btn-ghost" hidden>Cancel</button><button id="undo" class="btn-ghost"><img src="icons/ui/arrow-u-up-left.svg" alt="">Undo</button></div><div class="footer-meta"><span id="stats-text">Your tabs stay in your browser.</span><span id="cost-text"></span></div></footer>
<script src="popup.js"></script></body></html>
